
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um convite especial ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffdde2;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Corações animados */
        .coracao {
            position: fixed;
            bottom: -50px;
            color: #f48ba4;
            font-size: 25px;
            animation: subir linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.9;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .c1 { left: 5%; animation-duration: 7s; }
        .c2 { left: 15%; animation-duration: 9s; animation-delay: 2s; }
        .c3 { left: 25%; animation-duration: 6s; animation-delay: 1s; }
        .c4 { left: 35%; animation-duration: 8s; animation-delay: 3s; }
        .c5 { left: 45%; animation-duration: 7s; animation-delay: 4s; }
        .c6 { left: 55%; animation-duration: 10s; animation-delay: 1s; }
        .c7 { left: 65%; animation-duration: 6s; animation-delay: 2s; }
        .c8 { left: 75%; animation-duration: 9s; animation-delay: 3s; }
        .c9 { left: 85%; animation-duration: 7s; animation-delay: 1s; }
        .c10 { left: 95%; animation-duration: 8s; animation-delay: 4s; }

        /* Cartão principal */
        .cartao {
            background: white;
            width: 90%;
            max-width: 450px;
            min-height: 260px;
            padding: 55px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            z-index: 1;
        }

        h1 {
            color: #e8175d;
            font-size: 30px;
            margin-bottom: 38px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 18px 32px;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #sim {
            background: #4caf50;
            transition: transform 0.2s;
        }

        #sim:hover {
            transform: scale(1.1);
        }

        #nao {
            background: #f44336;
        }

        #mensagem {
            color: #e8175d;
            font-size: 19px;
            margin-top: 25px;
            font-weight: bold;
            line-height: 1.5;
        }

    </style>
</head>

<body>

    <!-- Corações flutuando -->
    <div class="coracao c1">♥</div>
    <div class="coracao c2">♥</div>
    <div class="coracao c3">♥</div>
    <div class="coracao c4">♥</div>
    <div class="coracao c5">♥</div>
    <div class="coracao c6">♥</div>
    <div class="coracao c7">♥</div>
    <div class="coracao c8">♥</div>
    <div class="coracao c9">♥</div>
    <div class="coracao c10">♥</div>

    <div class="cartao">

        <h1 id="titulo">Quer sair comigo? ❤️</h1>

        <div class="botoes">

            <button id="sim" onclick="aceitou()">
                Sim
            </button>

            <button id="nao" type="button">
                Não
            </button>

        </div>

        <p id="mensagem"></p>

    </div>

    <script>

        // Botão Sim
        function aceitou() {

            document.getElementById("titulo").innerHTML =
                "Aeee! Sabia que você ia aceitar! ❤️";

            document.querySelector(".botoes").style.display =
                "none";

            document.getElementById("mensagem").innerHTML =
                "Agora só falta escolhermos o dia do nosso encontro! 🥰💕";

        }

        // Botão Não fujão
        const botaoNao = document.getElementById("nao");

        function fugir() {

            const largura = botaoNao.offsetWidth;
            const altura = botaoNao.offsetHeight;

            const maxX = window.innerWidth - largura - 15;
            const maxY = window.innerHeight - altura - 15;

            const x = Math.random() * Math.max(0, maxX);
            const y = Math.random() * Math.max(0, maxY);

            botaoNao.style.position = "fixed";
            botaoNao.style.left = x + "px";
            botaoNao.style.top = y + "px";
            botaoNao.style.zIndex = "10";

        }

        botaoNao.addEventListener("pointerenter", fugir);

        botaoNao.addEventListener("click", fugir);

    </script>

</body>
</html>
